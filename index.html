<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Bayern Briefing" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0c0c0c" />
<title>Bayern Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--card:#151515;--card2:#1e1e1e;--line:#303030;--text:#f5f5f5;--muted:#aaa;--red:#DC052D;--gold:#f0bc2e;--blue:#0066b2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(220,5,45,.18),transparent 34%),linear-gradient(180deg,#0c0c0c,#050505);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}.top{position:sticky;top:0;z-index:9;background:rgba(12,12,12,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08);padding:calc(18px + env(safe-area-inset-top)) 18px 16px}.brand{display:flex;gap:14px;align-items:center}.badge{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#DC052D 0 47%,#fff 48% 58%,#0066b2 59% 71%,#DC052D 72%);box-shadow:0 0 32px rgba(220,5,45,.45);font:34px 'Bebas Neue';letter-spacing:2px}.title h1{font-family:'Bebas Neue';font-size:44px;letter-spacing:3px;margin:0}.title p{margin:4px 0 0;color:var(--muted);font-size:15px;line-height:1.35}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid rgba(255,255,255,.12);background:#1b1b1b;color:var(--text);border-radius:999px;padding:12px 17px;font-weight:800;font-size:15px;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);border-color:var(--red)}.btn.red{background:linear-gradient(135deg,#ef0035,#a80022);border-color:#ff3457}.btn.gold{background:linear-gradient(135deg,#ffd85a,#f0bc2e);color:#101010;border:none}.wrap{max-width:1180px;margin:auto;padding:20px 16px 60px}.filters{display:flex;gap:10px;overflow:auto;padding:2px 0 18px}.chip{white-space:nowrap;border:1px solid var(--line);background:#191919;color:#eee;border-radius:999px;padding:11px 16px;font-weight:700;cursor:pointer}.chip.active{background:rgba(220,5,45,.18);border-color:var(--red)}.status{color:var(--muted);font-size:14px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.card{background:linear-gradient(180deg,#191919,#111);border:1px solid rgba(255,255,255,.09);border-radius:24px;overflow:hidden;box-shadow:0 14px 45px rgba(0,0,0,.25);transition:.25s}.card:hover{transform:translateY(-5px);border-color:rgba(220,5,45,.55)}.thumb{height:162px;background:linear-gradient(135deg,rgba(220,5,45,.22),rgba(0,102,178,.18));position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{height:100%;display:grid;place-items:center;text-align:center;color:#fff;font:38px 'Bebas Neue';letter-spacing:2px;background:radial-gradient(circle at 20% 20%,rgba(220,5,45,.32),transparent 36%),linear-gradient(135deg,#151515,#090909)}.placeholder small{display:block;color:var(--gold);font:13px 'DM Sans';font-weight:800;letter-spacing:.06em;margin-top:6px}.content{padding:16px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;margin-bottom:10px}.source{color:#fff;font-weight:800}.headline{font-size:18px;line-height:1.28;margin:0 0 14px;font-weight:800}.headline a{color:inherit;text-decoration:none}.arabic{display:none;margin:12px 0 0;padding:12px;border-radius:16px;background:rgba(240,188,46,.1);border:1px solid rgba(240,188,46,.25);color:var(--gold);font-family:'Tajawal',sans-serif;direction:rtl;text-align:right;font-weight:700;line-height:1.6}.card.translated .arabic{display:block}.smallbtn{width:100%;padding:10px 12px;border-radius:14px;border:1px solid rgba(240,188,46,.3);background:rgba(240,188,46,.08);color:var(--gold);font-family:'Tajawal';font-weight:800;cursor:pointer}.skeleton{height:300px;border-radius:24px;background:linear-gradient(90deg,#141414,#242424,#141414);background-size:220% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-220% 0}}.empty{border:1px solid var(--line);border-radius:24px;padding:34px;text-align:center;background:#141414;color:var(--muted)}.empty b{display:block;color:#fff;font-size:22px;margin-bottom:8px}@media(max-width:640px){.title h1{font-size:35px}.badge{width:58px;height:58px}.top{padding-left:14px;padding-right:14px}.grid{grid-template-columns:1fr}.btn{font-size:14px}.thumb{height:190px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="badge">FCB</div><div class="title"><h1>Bayern Briefing</h1><p>Clean football news reader powered by Google News RSS</p></div></div><div class="actions"><button class="btn gold" id="translateAll">ترجمة الكل</button><button class="btn red" id="refresh">↻ Refresh</button></div></header>
<main class="wrap"><div class="filters"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="transfers">Transfers</button><button class="chip" data-filter="matches">Matches</button><button class="chip" data-filter="injuries">Injuries</button></div><p class="status" id="status">Loading…</p><section class="grid" id="grid"></section></main>
<script>
const RSS_ENDPOINT='/api/rss';
const META_ENDPOINT='/api/article-meta?url=';
const TRANSLATE_ENDPOINT='/api/translate';
let articles=[],activeFilter='all';
const grid=document.getElementById('grid'),statusEl=document.getElementById('status');
const translationCache=new Map(JSON.parse(sessionStorage.getItem('bb_translations')||'[]'));
const failedThumbs=new Set(JSON.parse(sessionStorage.getItem('bb_failed_thumbs')||'[]'));
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function strip(s=''){const d=document.createElement('div');d.innerHTML=s;return d.textContent||d.innerText||'';}
function timeAgo(d){const t=new Date(d).getTime();const sec=Math.max(1,(Date.now()-(Number.isFinite(t)?t:Date.now()))/1000);if(sec<3600)return Math.max(1,Math.floor(sec/60))+'m ago';if(sec<86400)return Math.floor(sec/3600)+'h ago';return Math.floor(sec/86400)+'d ago';}
function showSkeleton(){grid.innerHTML=Array.from({length:8},()=>'<div class="skeleton"></div>').join('');}
function getFilterText(f){return {transfers:'transfer signed signing bid deal loan contract rumour rumors mercato',matches:'match game win loss draw preview result goal score bundesliga champions league dfb',injuries:'injury injured fitness medical return unavailable muscle knee ankle hamstring'}[f]||''}
function visible(){if(activeFilter==='all')return articles;const words=getFilterText(activeFilter).split(' ');return articles.filter(a=>words.some(w=>(a.title+' '+a.description).toLowerCase().includes(w)));}
function rememberThumbFailure(url){if(!url)return;failedThumbs.add(url);sessionStorage.setItem('bb_failed_thumbs',JSON.stringify([...failedThumbs]));}
function makePlaceholder(){const ph=document.createElement('div');ph.className='placeholder';ph.innerHTML='<div>BAYERN<br>NEWS<small>No thumbnail</small></div>';return ph;}
function mountThumb(host,url){host.replaceChildren();if(!url||failedThumbs.has(url)){host.append(makePlaceholder());return;}const img=new Image();img.alt='';img.loading='lazy';img.decoding='async';img.width=640;img.height=360;img.addEventListener('error',()=>{rememberThumbFailure(url);host.replaceChildren(makePlaceholder());});img.src=url;host.append(img);}
function render(){const list=visible();statusEl.textContent=`${list.length} articles • Last updated ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;if(!list.length){grid.innerHTML='<div class="empty"><b>No articles found.</b>Try another filter or press Refresh.</div>';return;}grid.innerHTML=list.map((a,i)=>`<article class="card" data-idx="${a.id}"><div class="thumb" id="thumb-${a.id}"></div><div class="content"><div class="meta"><span class="source">${esc(a.source)}</span><span>${esc(timeAgo(a.pubDate))}</span></div><h2 class="headline"><a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2><button class="smallbtn" data-translate="${a.id}">🌐 عربي</button><div class="arabic" id="ar-${a.id}"></div></div></article>`).join('');list.forEach(a=>{mountThumb(document.getElementById('thumb-'+a.id),a.image);const cached=translationCache.get(a.title);if(cached)applyArabic(a.id,cached);});document.querySelectorAll('[data-translate]').forEach(btn=>btn.addEventListener('click',()=>translateOne(btn.dataset.translate)));hydrateMissingImages(list);}
async function hydrateMissingImages(list){for(const a of list){if(a.image)continue;const key='bb_meta_img:'+a.link;const cached=localStorage.getItem(key);if(cached){a.image=cached;mountThumb(document.getElementById('thumb-'+a.id),cached);continue;}try{const r=await fetch(META_ENDPOINT+encodeURIComponent(a.link));if(!r.ok)continue;const data=await r.json();if(data.image){localStorage.setItem(key,data.image);a.image=data.image;mountThumb(document.getElementById('thumb-'+a.id),data.image);}}catch(e){}}
}
function parseXml(txt){const xml=new DOMParser().parseFromString(txt,'text/xml');if(xml.querySelector('parsererror'))throw new Error('Invalid RSS XML');return [...xml.querySelectorAll('item')].map((item,idx)=>{const title=strip(item.querySelector('title')?.textContent||'');const source=item.querySelector('source')?.textContent||'Google News';const desc=item.querySelector('description')?.textContent||'';const media=item.querySelector('media\\:content, content')?.getAttribute('url')||item.querySelector('media\\:thumbnail, thumbnail')?.getAttribute('url')||item.querySelector('enclosure')?.getAttribute('url')||'';const imgFromDesc=(desc.match(/<img[^>]+src=["']([^"']+)/i)||[])[1]||'';const link=item.querySelector('link')?.textContent||'#';return {id:idx,title,source,description:strip(desc),link,pubDate:item.querySelector('pubDate')?.textContent||new Date().toISOString(),image:media||imgFromDesc};}).filter(a=>a.title);}
async function fetchNews(){showSkeleton();statusEl.textContent='Loading RSS…';try{const r=await fetch(RSS_ENDPOINT,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+r.statusText);articles=parseXml(await r.text());render();}catch(e){statusEl.textContent='RSS fetch failed';grid.innerHTML=`<div class="empty"><b>Could not load news.</b>The Netlify RSS function may not be deployed yet.<br><small>${esc(e.message)}</small></div>`;}}
async function translateTexts(texts){const res=await fetch(TRANSLATE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texts})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Translation failed');return data.translations||[];}
function applyArabic(id,text){const card=document.querySelector(`.card[data-idx="${CSS.escape(String(id))}"]`);const box=document.getElementById('ar-'+id);if(!card||!box)return;box.textContent=text;box.lang='ar';box.dir='rtl';card.classList.add('translated');box.style.display='block';}
async function translateOne(id){const a=articles.find(x=>String(x.id)===String(id));if(!a)return;const box=document.getElementById('ar-'+id);if(box){box.style.display='block';box.textContent='جاري الترجمة…';}try{let translated=translationCache.get(a.title);if(!translated){[translated]=await translateTexts([a.title]);translationCache.set(a.title,translated);sessionStorage.setItem('bb_translations',JSON.stringify([...translationCache]));}applyArabic(id,translated||'');}catch(e){if(box)box.textContent='تعذر تشغيل الترجمة. تأكد من إضافة ANTHROPIC_API_KEY في Netlify Environment variables.';}}
document.getElementById('refresh').onclick=fetchNews;document.getElementById('translateAll').onclick=async()=>{const list=visible().filter(a=>!translationCache.has(a.title)).slice(0,8);visible().forEach(a=>{const c=translationCache.get(a.title);if(c)applyArabic(a.id,c);});if(!list.length)return;list.forEach(a=>{const box=document.getElementById('ar-'+a.id);if(box){box.style.display='block';box.textContent='جاري الترجمة…';}});try{const out=await translateTexts(list.map(a=>a.title));list.forEach((a,i)=>{const t=out[i]||'';translationCache.set(a.title,t);applyArabic(a.id,t);});sessionStorage.setItem('bb_translations',JSON.stringify([...translationCache]));}catch(e){list.forEach(a=>{const box=document.getElementById('ar-'+a.id);if(box)box.textContent='تعذر تشغيل الترجمة. تأكد من Netlify function و API key.';});}};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;render();});
fetchNews();setInterval(fetchNews,6*60*1000);
</script>
</body>
</html>
